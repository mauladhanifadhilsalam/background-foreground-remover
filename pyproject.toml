[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cutout-studio"
version = "0.2.0"
description = "Self-hosted background/foreground remover with a web UI, CLI and MCP server for AI agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pillow>=10.4",
    "numpy>=1.26",
    "rembg>=2.0.60",
    "onnxruntime>=1.18",
    "huggingface_hub>=0.24",
    "httpx>=0.27",
    "mcp>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cutout = "app.cli:main"
cutout-mcp = "app.mcp_server:main"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
